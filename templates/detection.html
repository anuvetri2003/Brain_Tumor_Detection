<!DOCTYPE html>
<html>
<head>
<title>Detection</title>

<style>

body{
    margin:0;
    font-family:'Times New Roman', Times, serif;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* NAVBAR */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:15px 40px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    display:flex;
    gap:30px;
    z-index:1000;
}

.navbar a{
    color:white;
    text-decoration:none;
    font-size: 16px;
}

/* Background */

#bgVideo{
    position:fixed;
    top:0;
    left:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
    filter:blur(2px) brightness(0.6);
}

/* Glass Box */

.glass-box{
    width:420px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border-radius:20px;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
}

.glass-box h2{
    font-size: 32px;
}
/* FORM LAYOUT */

.form-row{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.form-row label{
    width:130px;
    font-weight:bold;
    color:white;
    text-align:left;
}

.form-row input{
    flex:1;
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* Drag & Drop */

.upload-box{
    margin:20px 0;
    padding:30px;
    border:2px dashed white;
    border-radius:12px;
    position:relative;
    cursor:pointer;
    transition:0.3s;
}

.upload-box input{
    position:absolute;
    inset:0;
    opacity:0;
}

.upload-box.dragover{
    border-color:#00e0ff;
    background:rgba(255,255,255,0.08);
    transform:scale(1.02);
}

/* Button */

.detect-btn{
    padding:10px 25px;
    border:2px solid white;
    background:transparent;
    color:white;
    border-radius:25px;
    cursor:pointer;
}

.detect-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

/* Progress bar */

.progress-container{
    width:100%;
    height:8px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin-top:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#000000,#ffffff);
    transition:width 0.3s;
}
</style>
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/detection">Detection</a>
        <a href="/database">Database</a>
        <a href="https://en.wikipedia.org/wiki/Brain_tumor" target="_blank">About</a>
    </nav>
    <video autoplay muted loop id="bgVideo">
        <source src="https://cdn.pixabay.com/video/2023/04/15/159049-818026306_large.mp4">
    </video>
    <div class="glass-box">
        <h2>BRAIN TUMOR DETECTION</h2>
        <form method="POST" action="/detect" enctype="multipart/form-data" autocomplete="off">
            <div class="form-row">
                <label>Patient Name :</label>
                <input type="text" name="patient_name" required>
            </div>
            <div class="form-row">
                <label>Age :</label>
                <input type="number" name="age" required>
            </div>
            <div class="form-row">
                <label>Scan Date :</label>
                <input type="date" name="scan_date" required>
            </div>
            <div class="upload-box" id="dropBox">
                <span id="uploadText">Drag & Drop MRI Image<br>or Click to Upload</span>
                <input type="file" id="fileInput" name="mri_image" accept="image/*" required>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p id="fileName" style="margin-top:10px;"></p>
            <button type="submit" class="detect-btn" id="detectBtn" disabled> Detect Tumor </button>
        </form>
    </div>
    <script>
        const fileInput = document.getElementById("fileInput");
        const uploadText = document.getElementById("uploadText");
        const dropBox = document.getElementById("dropBox");
        const progressBar = document.getElementById("progressBar");
        const detectBtn = document.getElementById("detectBtn");
        /* Progress Animation */
        function startProgress(){
            detectBtn.disabled = true;
            let progress = 0;
            progressBar.style.width = "0%";
            let interval = setInterval(function(){
            progress += 10;
            progressBar.style.width = progress + "%";
            if(progress >= 100){
            clearInterval(interval);
            detectBtn.disabled = false;
            }
            },150);
        }
        /* File select */
        fileInput.addEventListener("change",function(){
            if(this.files.length > 0){
            let name = this.files[0].name;
            uploadText.innerText = "Selected File: " + name;
            startProgress();
            }
        });
        /* Drag Over */
        dropBox.addEventListener("dragover",function(e){
            e.preventDefault();
            dropBox.classList.add("dragover");
        });
        /* Drag Leave */
        dropBox.addEventListener("dragleave",function(){
            dropBox.classList.remove("dragover");
        });
        /* Drop */
        dropBox.addEventListener("drop",function(e){
            e.preventDefault();
            dropBox.classList.remove("dragover");
            fileInput.files = e.dataTransfer.files;
            let name = fileInput.files[0].name;
            uploadText.innerText = "Selected File: " + name;
            startProgress();
        });
        /* Reset form after submit */
        document.querySelector("form").addEventListener("submit",function(){
            setTimeout(function(){
            document.querySelector("form").reset();
            },1000);
        });
        /* Reset when page loads (Fix for browser back button) */
        window.onload = function(){
            document.querySelector("form").reset();
        }
    </script>
</body>
</html>
